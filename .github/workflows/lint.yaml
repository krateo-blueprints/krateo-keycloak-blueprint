name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
on:
  pull_request:
    paths:
      - "**"
  # Every commit that reaches main gets a lint run, so release-tag can refuse a tag on a commit
  # that never passed lint (krateo-blueprints/charts PUBLISHING.md rule 10). A squash merge creates
  # a commit no pull-request run ever saw.
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The reuse-values gate reads values.yaml at previous release tags.
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      # Gating, unlike the informational step below. The bootstrap admin password is generated on
      # first install and must be REUSED on every upgrade: a reuse arm that silently stops firing
      # rotates the Secret away from the live admin with a clean render and a clean apply.
      # `helm template` cannot execute `lookup`, so this exercises the decision helper directly,
      # proves it catches a reuse-deleted mutant, and asserts the lookup/name wiring.
      - name: Gate the bootstrap admin password (reuse / generate / explicit)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 hack/check-bootstrap-password.py

      # Gating. core-provider turns values.schema.json into the Composition CRD, so a `required` key
      # becomes mandatory on every Composition CR, while values.yaml defaults only apply at render,
      # after admission. Requiring a defaulted key therefore enforces nothing and makes any CR that
      # omits it (or a partial parent object) uncreatable; on demo, keycloak 0.2.3's root
      # `required: [keycloak, db]` froze all 108 components of the platform umbrella. The gate
      # self-tests its detector on a mutant and a control before judging the real schemas.
      # `helm upgrade --reuse-values` uses the previous release's values and skips the new chart's
      # values.yaml defaults: 0.2.6 failed it from 0.2.5 with a nil pointer. Render under old values.
      - name: Gate --reuse-values upgrades (render under previous releases' values)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 hack/check-reuse-values.py

      # keycloak-operator's CRDs are templates (Helm never upgrades crds/): the rendered CRDs must be the
      # vendored upstream files plus helm.sh/resource-policy: keep, nothing else.
      - name: Gate the operator CRDs (rendered from templates/, unchanged, kept)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 hack/check-operator-crds.py

      # keycloak.http.relativePath: hostname builds the issuer, the relative path is where Keycloak serves;
      # the chart refuses a mismatch, and this keeps that refusal and the rendering from regressing.
      - name: Gate keycloak.http.relativePath (hack/check-relative-path.py)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 hack/check-relative-path.py

      - name: Gate values.schema.json (no `required` key that values.yaml defaults)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 hack/check-schema-required.py

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" 2>/dev/null || true
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)
