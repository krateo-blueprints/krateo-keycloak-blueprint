# Chart release workflow, derived from the canonical one shared by krateo-platformops,
# krateo-agentiko and krateo-blueprints. It differs from the canonical copy by the
# Marketplace-index publication the organisation's publishing standard requires (below).
# Two invariants it enforces:
#
#   layout   every chart lives at helm/<chart-name>/
#   tags     bare semver only: 0.3.39   (not v0.3.39, not name-0.1.0, not path/0.1.0)
#
# PUBLISHES ONLY WHAT CHANGED since the previous semver tag. A repo with 250 charts must
# not republish 250 artifacts because one line moved: that is minutes of CI, 250 registry
# writes, and 249 version bumps that contain no change. A chart's version is therefore the
# tag at which that chart last actually changed, so charts within a repo legitimately sit
# at different versions — which is how they are already consumed (the installer pins each
# component independently).
#
# Conservative by design: when the diff cannot be attributed confidently — no previous tag,
# or a change outside helm/ that any chart might depend on — it publishes EVERYTHING.
# Over-publishing is noise; under-publishing silently ships a stale chart.
#
# Every chart it publishes is published twice, with the same bytes (krateo-blueprints/charts
# PUBLISHING.md): to GHCR by the release job, and to the helm index the portal Marketplace
# installs from (https://krateo-blueprints.github.io/charts/<channel>/index.yaml) by the
# organisation's publisher, krateo-blueprints/charts/.github/workflows/publish-chart.yaml (pinned below).
# The channel follows from the content: keycloak (values.schema.json and a CompositionDefinition)
# is a blueprint, keycloak-operator an operator. Because only changed charts are published, a tag
# may carry one channel and not the other; each publish job runs when its channel has a chart.

name: release-tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  # contents: write — the stamped CompositionDefinition is attached to the release.
  # It is applied by hand and is not inside the packaged chart, so it must ship as a
  # release asset, not just live in the runner.
  contents: write
  packages: write

env:
  # The Marketplace channels this repository publishes to (PUBLISHING.md rule 2: the channel
  # follows from the content: blueprints, pages or operators). A chart whose content puts it in
  # another channel fails the release before anything is pushed, instead of reaching GHCR and
  # never reaching the index.
  CHANNELS: blueprints operators

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      blueprints: ${{ steps.package.outputs.blueprints }}
      operators: ${{ steps.package.outputs.operators }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to diff against the previous tag

      # Refuse to release a commit no lint run ever passed on (PUBLISHING.md rule 10). A quiet check
      # list reads as success, so the never-triggered case is the one this makes loud.
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          runs="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/lint.yaml/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | length')"
          ok="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/lint.yaml/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          echo "lint runs on ${sha}: ${runs} completed, ${ok} successful"
          if [ "${runs}" -eq 0 ]; then
            echo "::error::No lint run exists for ${sha}. Dispatch lint.yaml on this commit, confirm it passes, then re-tag."
            exit 1
          fi
          if [ "${ok}" -eq 0 ]; then
            echo "::error::lint ran on ${sha} but never succeeded. Refusing to publish."
            exit 1
          fi

      # The publish-index job below needs this secret, and it has no fallback (PUBLISHING.md rule 7).
      # Refuse here, before anything is pushed, so a missing token fails the release instead of
      # leaving GHCR holding a version the Marketplace index never receives.
      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release could not reach the"
            echo "::error::Marketplace index. Refusing to push to GHCR alone (krateo-blueprints/charts PUBLISHING.md rule 7)."
            exit 1
          fi
          # The publisher refuses a token carrying whitespace or a control character (typically a
          # trailing newline from piping into `gh secret set`), but only after this job has pushed to
          # GHCR. Refuse it here, by name, before anything is pushed. The token is never printed.
          case "${CHARTS_PUBLISH_TOKEN}" in
            *[[:space:]]*|*[[:cntrl:]]*)
              echo "::error::secret CHARTS_PUBLISH_TOKEN contains whitespace or a control character, usually a trailing newline."
              echo "::error::Re-save it by pasting the token at the prompt of 'gh secret set CHARTS_PUBLISH_TOKEN --org krateo-blueprints --visibility all' (not piped from echo)."
              exit 1 ;;
          esac

      - uses: azure/setup-helm@v4

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          # Owner-derived, so transferring a repo between orgs retargets automatically.
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Enforce the layout invariant
        run: |
          set -euo pipefail
          stray=$(find . -name Chart.yaml -not -path './.git/*' -not -path './helm/*' \
                       -not -path '*/charts/*' | head -5)
          if [ -n "$stray" ]; then
            echo "::error::charts must live at helm/<chart-name>/ — found outside helm/:"
            echo "$stray" | sed 's/^/  /'
            exit 1
          fi
          [ -d helm ] || { echo "::error::no helm/ directory"; exit 1; }

      - name: Select charts to publish
        run: |
          set -euo pipefail
          prev=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                 | grep -v "^${VERSION}$" | head -1 || true)

          publish_all() { find helm -mindepth 2 -maxdepth 2 -name Chart.yaml -exec dirname {} \; ; }

          if [ -z "$prev" ]; then
            echo "no previous semver tag — publishing every chart"
            publish_all > /tmp/charts.txt
          else
            echo "diffing against ${prev}"
            changed=$(git diff --name-only "${prev}..${VERSION}")
            # A change anywhere outside helm/ (shared CI, toolkit, root values) may affect
            # any chart. Cannot attribute it, so publish everything.
            if echo "$changed" | grep -qv '^helm/'; then
              echo "changes outside helm/ — publishing every chart (conservative)"
              publish_all > /tmp/charts.txt
            else
              echo "$changed" | awk -F/ 'NF>=2 {print "helm/"$2}' | sort -u \
                | while read -r d; do [ -f "$d/Chart.yaml" ] && echo "$d"; done > /tmp/charts.txt
            fi
          fi

          n=$(wc -l < /tmp/charts.txt | tr -d ' ')
          echo "selected ${n} chart(s):"
          sed 's/^/  /' /tmp/charts.txt
          # Publishing nothing on a release tag is almost always a mistake worth failing on.
          [ "$n" -gt 0 ] || { echo "::error::tag ${VERSION} changes no chart"; exit 1; }

      - name: Stamp every CompositionDefinition (guarded against an unpublished pin)
        run: |
          set -euo pipefail
          # The CD pins the version of the chart it installs but lives at repo root, outside
          # helm/, so the per-chart stamp below never touches it. Stamp it to the tag here —
          # but only after proving the chart it names is actually being published at this tag.
          # This repo publishes ONLY changed charts, so blindly stamping the CD to the tag could
          # point it at a version of its chart that was skipped and never pushed. Fail loudly in
          # that case rather than ship a CD naming a version that does not exist.
          found=0
          while IFS= read -r -d '' cd; do
            # chart name = last path segment of the CD's OCI url (oci://.../charts/<name>)
            target=$(awk '/^[[:space:]]*url:/{n=$2; sub(/.*\//,"",n); print n; exit}' "$cd")
            if ! grep -qx "helm/${target}" /tmp/charts.txt; then
              echo "::error::${cd} pins chart '${target}', which is NOT being published at ${VERSION}."
              echo "  selected charts: $(tr '\n' ' ' < /tmp/charts.txt)"
              echo "  Stamping the CD to ${VERSION} would name a version of '${target}' that was never pushed."
              echo "  Change '${target}' in this release, or cut the CD change on a tag that also publishes it."
              exit 1
            fi
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"
            echo "stamped $cd -> ${VERSION} (chart '${target}' is in the publish set)"
            found=$((found+1))
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "CompositionDefinitions stamped: $found"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # Every chart is packaged and checked first, and only then is anything pushed, so a chart the
      # Marketplace index would refuse never reaches GHCR either (PUBLISHING.md rules 1 to 3).
      - name: Package and check every selected chart
        id: package
        run: |
          set -euo pipefail
          want_base="oci://ghcr.io/krateo-blueprints/charts"
          mkdir -p pkg dist/blueprints dist/pages dist/operators

          # The CompositionDefinition of each chart, keyed by the chart it installs: the last
          # segment of its spec.chart.url.
          declare -A cd_for=()
          while IFS= read -r -d '' cd; do
            url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' "$cd")"
            url="${url%%$'\n'*}"
            if [ -z "$url" ] || [ "$url" = null ]; then
              echo "::error::${cd} has no CompositionDefinition spec.chart.url"; exit 1
            fi
            target="${url##*/}"
            if [ -n "${cd_for[$target]:-}" ]; then
              echo "::error::${cd_for[$target]} and ${cd} both install ${target}"; exit 1
            fi
            cd_for[$target]="$cd"
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)

          while read -r dir; do
            [ -z "$dir" ] && continue
            cf="$dir/Chart.yaml"
            name="$(yq -r '.name' "$cf")"
            echo "::group::${name} (${dir})"
            # The chart name is the public contract; the directory must match it so a
            # reader can find the source of oci://.../charts/<name> without grepping.
            [ "$name" = "$(basename "$dir")" ] || {
              echo "::error::${cf}: name '${name}' != directory '$(basename "$dir")'"; exit 1; }
            # CHART_VERSION placeholder is substituted from the tag; never hand-maintained.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"
            if grep -q '^dependencies:' "$cf"; then
              helm dependency update "$dir"
            fi

            # The channel follows from the content (PUBLISHING.md rule 2).
            cd="${cd_for[$name]:-}"
            if [ -n "$cd" ] && [ ! -f "$dir/values.schema.json" ]; then
              echo "::error::${cd} installs ${name}, which has no values.schema.json, so core-provider cannot generate its CRD"
              exit 1
            fi
            if [ -z "$cd" ]; then
              channel=operators
            elif [ "$(yq -r '.annotations."krateo.io/kind" // ""' "$cf")" = page-set ]; then
              channel=pages
            else
              channel=blueprints
            fi
            case " ${CHANNELS} " in
              *" ${channel} "*)
                : ;;
              *)
                echo "::error::${name} is ${channel} content, but this workflow publishes only to: ${CHANNELS}"
                exit 1 ;;
            esac

            if [ "$channel" != operators ]; then
              cd_url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' "$cd")"
              cd_url="${cd_url%%$'\n'*}"
              cd_ver="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.version' "$cd")"
              cd_ver="${cd_ver%%$'\n'*}"
              [ "$cd_url" = "${want_base}/${name}" ] || {
                echo "::error::${cd} installs ${cd_url}, not ${want_base}/${name}"; exit 1; }
              [ "$cd_ver" = "$VERSION" ] || {
                echo "::error::${cd} installs ${name} version '${cd_ver}', not ${VERSION}"; exit 1; }
              # Ship the stamped CompositionDefinition inside the chart, at the root, where helm
              # packages it but never renders it (rule 3). Removed again after packaging, so any
              # later step that looks for CompositionDefinitions finds only the repository's own.
              cp "$cd" "$dir/compositiondefinition.yaml"
            fi

            helm package "$dir" --version "${VERSION}" --destination pkg
            tgz="pkg/${name}-${VERSION}.tgz"
            packed_chart="$(tar -xzO -f "$tgz" "${name}/Chart.yaml")"

            # Every chart, in every channel, names the repository that builds it (rule 3), so a
            # pinned chart can be traced to the commit and CI run that built it.
            src_url="https://github.com/${GITHUB_REPOSITORY}"
            srcs="$(yq -r '.sources // [] | .[]' <<< "$packed_chart")"
            grep -qxF "$src_url" <<< "$srcs" || {
              echo "::error::${name}: Chart.yaml sources: must list ${src_url}, the repository that builds it"; exit 1; }

            if [ "$channel" != operators ]; then
              rm "$dir/compositiondefinition.yaml"
              # Check the archive, not the copy: helm package exits 0 whether or not the file made
              # it in. These are the checks the Marketplace publisher makes; failing them here
              # keeps a refused chart out of GHCR too.
              members="$(tar tzf "$tgz")"
              for want in "${name}/compositiondefinition.yaml" "${name}/values.schema.json"; do
                grep -qxF "$want" <<< "$members" || {
                  echo "::error::${tgz} lacks ${want}; refusing to push"; exit 1; }
              done
              packed_cd="$(tar -xzO -f "$tgz" "${name}/compositiondefinition.yaml")"
              packed_url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' <<< "$packed_cd")"
              packed_ver="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.version' <<< "$packed_cd")"
              [ "${packed_url%%$'\n'*}" = "${want_base}/${name}" ] && [ "${packed_ver%%$'\n'*}" = "$VERSION" ] || {
                echo "::error::${tgz}: its CompositionDefinition installs ${packed_url} ${packed_ver}"; exit 1; }
              icon="$(yq -r '.icon // ""' <<< "$packed_chart")"
              case "$icon" in
                https://*)
                  : ;;
                *)
                  echo "::error::${name}: Chart.yaml icon must be an absolute https URL, got '${icon}'"; exit 1 ;;
              esac
              [ "$(yq -r '(.keywords // []) | length' <<< "$packed_chart")" -gt 0 ] || {
                echo "::error::${name}: Chart.yaml needs keywords, the Marketplace's tags"; exit 1; }
            fi

            mv "$tgz" "dist/${channel}/"
            echo "${name} ${VERSION} -> ${channel}"
            unset "cd_for[$name]"
            echo "::endgroup::"
          done < /tmp/charts.txt

          if [ "${#cd_for[@]}" -gt 0 ]; then
            echo "::error::CompositionDefinitions install charts this release does not publish: ${!cd_for[*]}"
            exit 1
          fi
          for channel in blueprints operators; do
            echo "${channel}=$(find "dist/${channel}" -name '*.tgz' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          done

      - name: Push every chart to GHCR
        run: |
          set -euo pipefail
          for tgz in dist/*/*.tgz; do
            helm push "$tgz" "${OCI_REPO}"
            echo "pushed $(basename "$tgz" .tgz)"
          done

      # The same bytes that went to GHCR, for the Marketplace index, one artifact per channel.
      - name: Hand the blueprint tarballs to the index job
        if: steps.package.outputs.blueprints != '0'
        uses: actions/upload-artifact@v4
        with:
          name: charts-blueprints
          path: dist/blueprints/*.tgz
          if-no-files-found: error

      - name: Hand the operator tarballs to the index job
        if: steps.package.outputs.operators != '0'
        uses: actions/upload-artifact@v4
        with:
          name: charts-operators
          path: dist/operators/*.tgz
          if-no-files-found: error

      - name: Verify anonymous pullability
        run: |
          set -uo pipefail
          # New GHCR packages default to PRIVATE and do not inherit visibility across orgs.
          # core-provider pulls anonymously in-cluster, so a private package fails at
          # provisioning with an opaque error. Fail loudly here instead.
          fail=0
          while read -r dir; do
            [ -z "$dir" ] && continue
            name=$(basename "$dir")
            repo="${GITHUB_REPOSITORY_OWNER,,}/charts/${name}"
            tok=$(curl -s "https://ghcr.io/token?scope=repository:${repo}:pull" \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
                   -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                   "https://ghcr.io/v2/${repo}/manifests/${VERSION}")
            if [ "$code" = "200" ]; then
              echo "  ${name}: public"
            else
              echo "::warning::${name} is NOT anonymously pullable (HTTP ${code}) — set the package public"
              fail=1
            fi
          done < /tmp/charts.txt
          exit 0   # warn, don't block: visibility is a one-time manual step per package

      - name: Publish the stamped CompositionDefinitions on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Runs after the charts are pushed: the chart is the primary artifact and an asset
          # problem must never block it. Stage into a fresh dir so a root-level CD is never
          # cp'd onto itself (an error, not a no-op — a lesson from selfservice 0.2.26).
          stage="$(mktemp -d)"; assets=()
          while IFS= read -r -d '' cd; do
            d="$(dirname "$cd")"
            if [ "$d" = "." ]; then out="compositiondefinition.yaml"; else out="compositiondefinition-$(basename "$d").yaml"; fi
            cp "$cd" "$stage/$out"; assets+=("$stage/$out")
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          [ ${#assets[@]} -eq 0 ] && { echo "no CompositionDefinition to publish"; exit 0; }
          gh release view "${VERSION}" >/dev/null 2>&1 \
            || gh release create "${VERSION}" --title "${VERSION}" --notes "Apply the attached CompositionDefinition to register this version."
          gh release upload "${VERSION}" "${assets[@]}" --clobber
          echo "attached: ${assets[*]}"

  # The Marketplace installs what https://krateo-blueprints.github.io/charts/<channel>/index.yaml
  # lists, not what GHCR holds. The organisation's one publisher
  # (krateo-blueprints/charts PUBLISHING.md), once per channel; it also reads the served index and
  # installs every chart anonymously before it succeeds. A channel with no chart in this release
  # pushed nothing to GHCR either, so its job is skipped.
  publish-blueprints:
    needs: release
    if: needs.release.outputs.blueprints != '0'
    # PUBLISHING.md rule 9: pinned by full commit SHA; .github/dependabot.yml keeps it current.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@36ea357cb0fe4b49628cc984d9939babf0049d03 # 1.0.1
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
      artifact: charts-blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}

  publish-operators:
    needs: release
    if: needs.release.outputs.operators != '0'
    # PUBLISHING.md rule 9: pinned by full commit SHA; .github/dependabot.yml keeps it current.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@36ea357cb0fe4b49628cc984d9939babf0049d03 # 1.0.1
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: operators
      artifact: charts-operators
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
