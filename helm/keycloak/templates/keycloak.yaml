apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ .Values.keycloak.name }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.keycloak.instances }}
  {{- with .Values.keycloak.image }}
  image: {{ . | quote }}
  {{- end }}
  db:
    vendor: {{ .Values.db.vendor }}
    database: {{ .Values.db.database }}
    {{- if eq .Values.db.provider "cloudnativepg" }}
    host: {{ .Values.db.cloudnativepg.clusterName }}-rw
    port: 5432
    usernameSecret:
      name: {{ .Values.db.cloudnativepg.clusterName }}-app
      key: username
    passwordSecret:
      name: {{ .Values.db.cloudnativepg.clusterName }}-app
      key: password
    {{- else }}
    host: {{ .Values.db.host }}
    port: {{ .Values.db.port }}
    usernameSecret:
      name: {{ .Values.db.secret.name }}
      key: {{ .Values.db.secret.usernameKey }}
    passwordSecret:
      name: {{ .Values.db.secret.name }}
      key: {{ .Values.db.secret.passwordKey }}
    {{- end }}
  http:
    httpEnabled: {{ .Values.keycloak.http.httpEnabled }}
    {{- with .Values.keycloak.http.tlsSecretName }}
    tlsSecret: {{ . | quote }}
    {{- end }}
  hostname:
    hostname: {{ .Values.keycloak.hostname | quote }}
  ingress:
    enabled: {{ .Values.keycloak.ingress.enabled }}
    {{- with .Values.keycloak.ingress.className }}
    className: {{ . | quote }}
    {{- end }}
  {{- with .Values.keycloak.proxyHeaders }}
  proxy:
    headers: {{ . | quote }}
  {{- end }}
  {{- if or .Values.bootstrapAdmin.enabled .Values.bootstrapAdmin.service.enabled }}
  bootstrapAdmin:
    {{- if .Values.bootstrapAdmin.enabled }}
    user:
      secret: {{ .Values.bootstrapAdmin.secret.name }}
    {{- end }}
    {{- if .Values.bootstrapAdmin.service.enabled }}
    service:
      secret: {{ .Values.bootstrapAdmin.service.secret.name }}
    {{- end }}
  {{- end }}
  {{- $rp := .Values.keycloak.http.relativePath | default "" }}
  {{- $opts := .Values.keycloak.additionalOptions | default list }}
  {{- range $opts }}
  {{- if eq (toString .name) "http-relative-path" }}
  {{- fail "keycloak.additionalOptions: set the path prefix with keycloak.http.relativePath, not an http-relative-path option (the chart checks it against keycloak.hostname, which builds the token issuer)" }}
  {{- end }}
  {{- end }}
  {{- if $rp }}
  {{- if or (not (hasPrefix "/" $rp)) (hasSuffix "/" $rp) }}
  {{- fail (printf "keycloak.http.relativePath %q must start with \"/\" and must not end with \"/\" (e.g. /keycloak)" $rp) }}
  {{- end }}
  {{- if not (hasSuffix $rp (.Values.keycloak.hostname | trimSuffix "/")) }}
  {{- fail (printf "keycloak.hostname %q must end with keycloak.http.relativePath %q (e.g. https://portal.example.com%s): Keycloak builds the token issuer from hostname, and serves under the relative path" .Values.keycloak.hostname $rp $rp) }}
  {{- end }}
  {{- $opts = append $opts (dict "name" "http-relative-path" "value" $rp) }}
  {{- end }}
  {{- with $opts }}
  additionalOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
