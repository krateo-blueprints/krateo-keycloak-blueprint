{{- /* In cloudnativepg mode CNPG creates the credentials Secret; only render
       our own DB Secret in external mode. */ -}}
{{- if and (ne .Values.db.provider "cloudnativepg") .Values.db.secret.create }}
{{- /* This password must match an EXTERNAL database, so the chart cannot generate it, and a
     weak default would be installed silently. Refuse instead, naming both ways out. */ -}}
{{- $dbPassword := .Values.db.secret.password }}
{{- if or (not $dbPassword) (eq $dbPassword "change-me") }}
{{- fail "db.secret.password must be set to your external database's password (it cannot be empty or \"change-me\") when db.provider=external and db.secret.create=true. Either set db.secret.password, or set db.secret.create=false and reference an existing Secret (e.g. one synced by External Secrets Operator) via db.secret.name." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.secret.name }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.db.secret.usernameKey }}: {{ .Values.db.secret.username | quote }}
  {{ .Values.db.secret.passwordKey }}: {{ $dbPassword | quote }}
{{- end }}
{{- if and .Values.bootstrapAdmin.enabled .Values.bootstrapAdmin.secret.create }}
{{- /* ONE name, used for BOTH the lookup and metadata.name. If they diverged, the lookup would
     miss on every render and a new password would be generated every upgrade -- a clean render
     and a clean apply each time, and a Secret that no longer matches the live admin.
     hack/check-bootstrap-password.py asserts they are the same variable. */ -}}
{{- $bootstrapName := .Values.bootstrapAdmin.secret.name }}
{{- $bootstrapFound := lookup "v1" "Secret" .Release.Namespace $bootstrapName }}
{{- $bootstrapPassword := include "keycloak.bootstrapAdminPassword" (list $bootstrapFound .Values.bootstrapAdmin.secret.password) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $bootstrapName }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.bootstrapAdmin.secret.username | quote }}
  password: {{ $bootstrapPassword | quote }}
{{- end }}
