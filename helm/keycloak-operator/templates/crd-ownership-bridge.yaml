{{- /*
`helm upgrade --reuse-values` from a release older than 0.2.6 reuses that release's values, which have
no crdOwnershipBridge key, and does not apply this chart's values.yaml defaults: read the key with
defaults here so that upgrade works (0.2.6 failed it with a nil pointer). Keep the default image equal to
values.yaml's (CI checks both renders).
*/ -}}
{{- $bridge := mergeOverwrite (dict "enabled" true "image" "registry.k8s.io/kubectl:v1.36.4@sha256:b8d523e7b8cdc5e3caa0f8891ee9f504abf137dec786e6e0ddd33e4f272c2f13") (.Values.crdOwnershipBridge | default dict) }}
{{- if $bridge.enabled }}
{{- $name := printf "%s-crd-ownership" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $crds := list "keycloaks.k8s.keycloak.org" "keycloakrealmimports.k8s.keycloak.org" }}
# BRIDGE to the release that installs these CRDs from templates/ (0.3.0). Today they come from
# crds/, which Helm installs once without ownership metadata; a later release that renders them as
# templates would then fail Helm's ownership check ("exists and cannot be imported into the current
# release"), and a pre-upgrade hook cannot help because Helm checks ownership before it runs
# pre-upgrade hooks (measured). This post-install/post-upgrade Job stamps THIS release's ownership
# on both CRDs, so the templates/ release adopts them. Every install and upgrade re-stamps; the
# patch is idempotent. The ServiceAccount and RBAC are ordinary release resources (not hooks), so
# they exist before the Job runs and go away on uninstall.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      {{- range $crds }}
      - {{ . }}
      {{- end }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- range $i, $crd := $crds }}
        - name: stamp-{{ $i }}
          image: {{ $bridge.image }}
          args:
            - patch
            - customresourcedefinition
            - {{ $crd }}
            - --type=merge
            - -p
            - {{ printf "{\"metadata\":{\"labels\":{\"app.kubernetes.io/managed-by\":\"Helm\"},\"annotations\":{\"meta.helm.sh/release-name\":%q,\"meta.helm.sh/release-namespace\":%q}}}" $.Release.Name $.Release.Namespace | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- end }}
{{- end }}
